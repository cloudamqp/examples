version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python/celery
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directory: /dotnet/rabbitmq-dotnet-client
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /go/amqp-client
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directory: /java/rabbitmq-java-client
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /nodejs/amqp-client
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directory: /php/php-amqplib
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /python/pika
    schedule:
      interval: weekly
  - package-ecosystem: bundler
    directory: /ruby/amqp-client
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /rust/amqp-client
    schedule:
      interval: weekly
