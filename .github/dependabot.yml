# One entry per package ecosystem; add new example folders to `directories`.
# Not supported by dependabot: Leiningen (clojure/*), shards (crystal/*).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directories: [/python/celery, /python/pika]
    schedule:
      interval: weekly
  - package-ecosystem: nuget
    directories: [/dotnet/rabbitmq-client]
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directories: [/go/amqp-client]
    schedule:
      interval: weekly
  - package-ecosystem: maven
    directories: [/java/rabbitmq-client]
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directories: [/javascript/amqp-client, /typescript/amqp-client]
    schedule:
      interval: weekly
  - package-ecosystem: composer
    directories: [/php/php-amqplib]
    schedule:
      interval: weekly
  - package-ecosystem: bundler
    directories: [/ruby/amqp-client, /ruby/mqtt]
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directories: [/rust/amqp-client]
    schedule:
      interval: weekly
