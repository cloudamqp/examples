name: swift/mqttnio

on:
  push:
    branches: [main]
    paths: ["swift/mqttnio/**", ".github/workflows/swift-mqttnio.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["swift/mqttnio/**", ".github/workflows/swift-mqttnio.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: swift/mqttnio
      test: swift test
