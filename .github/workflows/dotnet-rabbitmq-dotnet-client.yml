name: dotnet-rabbitmq-dotnet-client

on:
  push:
    branches: [main]
    paths: ["dotnet/rabbitmq-dotnet-client/**", ".github/workflows/dotnet-rabbitmq-dotnet-client.yml"]
  pull_request:
    paths: ["dotnet/rabbitmq-dotnet-client/**", ".github/workflows/dotnet-rabbitmq-dotnet-client.yml"]

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

permissions:
  contents: read

defaults:
  run:
    working-directory: dotnet/rabbitmq-dotnet-client

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      lavinmq:
        image: cloudamqp/lavinmq:latest
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          working_directory: dotnet/rabbitmq-dotnet-client

      - name: Wait for LavinMQ
        run: |
          for _ in $(seq 60); do
            curl -sf -u guest:guest http://localhost:15672/api/overview >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Test
        run: dotnet test
