name: java/paho-mqtt

on:
  push:
    branches: [main]
    paths: ["java/paho-mqtt/**", ".github/workflows/java-paho-mqtt.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["java/paho-mqtt/**", ".github/workflows/java-paho-mqtt.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: java/paho-mqtt
      test: mvn --batch-mode test
