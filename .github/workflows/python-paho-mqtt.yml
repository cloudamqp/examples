name: python/paho-mqtt

on:
  push:
    branches: [main]
    paths: ["python/paho-mqtt/**", ".github/workflows/python-paho-mqtt.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["python/paho-mqtt/**", ".github/workflows/python-paho-mqtt.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: python/paho-mqtt
      test: |
        pip install -r requirements-dev.txt
        pytest
