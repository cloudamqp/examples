name: crystal

on:
  push:
    branches: [main]
    paths: ["crystal/**", ".github/workflows/crystal.yml"]
  pull_request:
    paths: ["crystal/**", ".github/workflows/crystal.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: crystal

jobs:
  test:
    runs-on: ubuntu-24.04
    services:
      lavinmq:
        image: cloudamqp/lavinmq:latest
        ports:
          - 5672:5672
          - 15672:15672
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5
        with:
          working_directory: crystal

      # Regex (used by spec) needs PCRE2, ameba needs libyaml
      - name: Install libraries
        run: sudo apt-get update && sudo apt-get install -y libpcre2-dev libyaml-dev

      - name: Wait for LavinMQ
        run: |
          for _ in $(seq 60); do
            curl -sf -u guest:guest http://localhost:15672/api/overview >/dev/null && exit 0
            sleep 1
          done
          exit 1

      - name: Test
        run: |
          shards install
          crystal tool format --check
          mkdir -p bin
          crystal build lib/ameba/bin/ameba.cr -o bin/ameba
          bin/ameba
          crystal spec
