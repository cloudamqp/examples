name: rust/amqp-client

on:
  push:
    branches: [main]
    paths: ["rust/amqp-client/**", ".github/workflows/rust-amqp-client.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["rust/amqp-client/**", ".github/workflows/rust-amqp-client.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: rust/amqp-client
      test: |
        cargo clippy --all-targets -- -D warnings
        cargo test
