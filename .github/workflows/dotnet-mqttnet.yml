name: dotnet/mqttnet

on:
  push:
    branches: [main]
    paths: ["dotnet/mqttnet/**", ".github/workflows/dotnet-mqttnet.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["dotnet/mqttnet/**", ".github/workflows/dotnet-mqttnet.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: dotnet/mqttnet
      test: DOTNET_CLI_TELEMETRY_OPTOUT=1 DOTNET_NOLOGO=1 dotnet test --project Tests
