name: java/rabbitmq-client

on:
  push:
    branches: [main]
    paths: ["java/rabbitmq-client/**", ".github/workflows/java-rabbitmq-client.yml", ".github/workflows/_example.yml"]
  pull_request:
    paths: ["java/rabbitmq-client/**", ".github/workflows/java-rabbitmq-client.yml", ".github/workflows/_example.yml"]

permissions:
  contents: read

jobs:
  test:
    uses: ./.github/workflows/_example.yml
    with:
      directory: java/rabbitmq-client
      test: mvn --batch-mode test
